[project]
name = "kb-admin"
version = "0.1.0"
description = "Knowledge Base Management System — admin backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",  # Alembic sync driver for migrations
    "bcrypt>=4.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "colorlog>=6.10.1",
]